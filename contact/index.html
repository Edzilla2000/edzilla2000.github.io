<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Zone Alert</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --red-deep: #9b111e;
    --red: #c81a2e;
    --red-light: #ffe0e0;
    --ink: #222;
    --muted: #6b6b6b;
    --bg: #faf8f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; }
  .hero {
    background: linear-gradient(160deg, var(--red-deep) 0%, var(--red) 100%);
    color: #fff; padding: 40px 24px; text-align: center;
  }
  .hero a { color: #fff; text-decoration: none; font-weight: 600; }
  .hero h1 { font-size: 2rem; margin-top: 8px; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 24px 64px; }
  .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  input, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px;
    font: inherit; background: #fff;
  }
  input:focus, textarea:focus { outline: 2px solid var(--red); border-color: transparent; }
  textarea { min-height: 140px; resize: vertical; }
  button {
    margin-top: 22px; width: 100%; padding: 14px; border: 0; border-radius: 999px;
    background: var(--red); color: #fff; font: inherit; font-weight: 600; font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: var(--red-deep); }
  .success {
    display: none; background: #e6f6e6; border: 1px solid #b6e2b6; color: #1d6b1d;
    border-radius: 10px; padding: 14px; margin-bottom: 18px;
  }
  .hp { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .9rem; padding-bottom: 40px; }
  footer a { color: var(--red); }
</style>
</head>
<body>

<div class="hero">
  <a href="/">← Zone Alert</a>
  <h1>Get in touch</h1>
</div>

<main>
  <div id="sent" class="success">Thanks — your message is on its way. We'll get back to you soon.</div>
  <div class="card">
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="606902ec-4a7c-4f31-b84e-06e29120d76b">
      <input type="hidden" name="subject" value="Zone Alert contact form">
      <input type="hidden" name="from_name" value="Zone Alert website">
      <input type="hidden" name="redirect" value="https://edzilla2000.github.io/contact/?sent=1">
      <!-- Honeypot: bots fill it, humans never see it -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <label for="name">Name</label>
      <input id="name" type="text" name="name" required autocomplete="name">

      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email">

      <label for="message">Message</label>
      <textarea id="message" name="message" required
        placeholder="Bug reports, city requests, questions — all welcome."></textarea>

      <button type="submit">Send message</button>
    </form>
  </div>
</main>

<footer>
  <p><a href="/">Home</a> · <a href="https://edzilla2000.github.io/zonealert-data/privacy.html">Privacy policy</a></p>
</footer>

<script>
  if (new URLSearchParams(location.search).has('sent')) {
    document.getElementById('sent').style.display = 'block';
  }
</script>

</body>
</html>
